name: Publish

# Runs when you push a version tag (e.g. `git tag v1.1.0 && git push origin v1.1.0`),
# or manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets vsce get a GitHub OIDC token for Marketplace Trusted Publishing (no PAT needed).
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Package extension
        run: |
          VSIX="vscode-power-mode-reborn-$(node -p "require('./package.json').version").vsix"
          # No runtime "dependencies" in package.json, so skip vsce's npm-list scan.
          npx --yes @vscode/vsce@4 package --no-dependencies --out "$VSIX"
          echo "VSIX=$VSIX" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ env.VSIX }}

      - name: Publish to VS Code Marketplace
        # --skip-duplicate makes a re-run safe if this version is already up.
        run: npx --yes @vscode/vsce@4 publish --oidc --skip-duplicate --packagePath "$VSIX"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          # Open VSX namespace is different from the Marketplace publisher (BhavyaJustChilll).
          OVSX_NAMESPACE: bhavyajustchill
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT secret not set, skipping Open VSX."
            exit 0
          fi
          # Open VSX takes the namespace from "publisher", so repackage with the Open VSX one.
          npm pkg set publisher="$OVSX_NAMESPACE"
          OVSX_VSIX="${VSIX%.vsix}-openvsx.vsix"
          npx --yes @vscode/vsce@4 package --no-dependencies --out "$OVSX_VSIX"
          # ovsx reads the token from the OVSX_PAT env var.
          npx --yes ovsx publish "$OVSX_VSIX" --skip-duplicate
