name: Publish

# Runs when you push a version tag (e.g. `git tag v1.1.0 && git push origin v1.1.0`),
# or manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets vsce get a GitHub OIDC token for Marketplace Trusted Publishing (no PAT needed).
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Package extension
        id: package
        run: |
          VSIX="$(node -p "require('./package.json').name")-$(node -p "require('./package.json').version").vsix"
          # No runtime "dependencies" in package.json, so skip vsce's npm-list scan.
          npx --yes @vscode/vsce@4 package --no-dependencies --out "$VSIX"
          echo "VSIX=$VSIX" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ env.VSIX }}

      - name: Publish to VS Code Marketplace
        # --skip-duplicate makes a re-run safe if this version is already up.
        run: npx --yes @vscode/vsce@4 publish --oidc --skip-duplicate --packagePath "$VSIX"

      - name: Publish to Open VSX
        # Run even if the Marketplace step failed, so one registry can't block the other.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          # Open VSX keeps the original namespace and name; the Marketplace uses
          # BhavyaJustChilll.power-mode-reborn (see README "Install").
          OVSX_NAMESPACE: bhavyajustchill
          OVSX_NAME: vscode-power-mode-reborn
        run: |
          # Open VSX takes the namespace and extension from "publisher" and "name",
          # so repackage with the Open VSX values.
          npm pkg set publisher="$OVSX_NAMESPACE" name="$OVSX_NAME"
          OVSX_VSIX="$OVSX_NAME-$(node -p "require('./package.json').version").vsix"
          npx --yes @vscode/vsce@4 package --no-dependencies --out "$OVSX_VSIX"
          # Trusted Publishing: exchanges this job's GitHub OIDC token, no OVSX_PAT needed.
          npx --yes ovsx@1 publish "$OVSX_VSIX" --trusted-publishing --skip-duplicate
